# 知脉主后端 → 阿里云函数计算 FC（custom.debian10 web 函数）
# 部署：cd deploy/fc/zhimai-api && s deploy -y
edition: 3.0.0
name: zhimai-api
access: default
vars:
  region: cn-beijing
  functionName: zhimai-api

resources:
  api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: zhimai FastAPI backend (route/RAG/rewrite)
      runtime: custom.debian10
      logConfig: auto
      timeout: 120
      cpu: 1
      memorySize: 1024
      diskSize: 10240
      instanceConcurrency: 50
      internetAccess: true
      code: ../../../backend
      customRuntimeConfig:
        command:
          - python3
        args:
          - '-u'
          - index.py
        port: 9000
      environmentVariables:
        PATH: >-
          /var/fc/lang/python3.10/bin:/usr/local/bin:/usr/bin:/bin:/code
        PYTHONPATH: /code/vendor
        SUPABASE_URL: ${env(SUPABASE_URL)}
        SUPABASE_SERVICE_KEY: ${env(SUPABASE_SERVICE_KEY)}
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        DEEPSEEK_API_KEY: ${env(DEEPSEEK_API_KEY)}
        ALLOWED_ORIGINS: ${env(ALLOWED_ORIGINS)}
        QWEN_MODEL_CHAT: ${env(QWEN_MODEL_CHAT)}
        QWEN_MODEL_ROUTER: ${env(QWEN_MODEL_ROUTER)}
        EMBEDDING_MODEL: ${env(EMBEDDING_MODEL)}
        MIN_RETRIEVE_SCORE: ${env(MIN_RETRIEVE_SCORE)}
        KB_SOURCE_BASE: ${env(KB_SOURCE_BASE)}
        ADMIN_PASSWORD_HASH: ${env(ADMIN_PASSWORD_HASH)}
        ADMIN_SESSION_SECRET: ${env(ADMIN_SESSION_SECRET)}
        ADMIN_SESSION_TTL: ${env(ADMIN_SESSION_TTL)}
        # v2：迁移验收通过前一律保持 0（挂载开关 + 访谈引擎开关 + 共享配额开关）
        V2_MEMORY_ENABLED: ${env(V2_MEMORY_ENABLED)}
        # v3 迁移/验收前保持 0；由部署环境显式设置，不在代码中自动启用。
        V3_MEMORY_ENABLED: ${env(V3_MEMORY_ENABLED)}
        V2_SHARED_QUOTA: ${env(V2_SHARED_QUOTA)}
        V2_IP_LIMIT_PER_MIN: ${env(V2_IP_LIMIT_PER_MIN)}
        V2_ANON_TURNS_PER_DAY: ${env(V2_ANON_TURNS_PER_DAY)}
        COACH_ENABLED: ${env(COACH_ENABLED)}
        COACH_MAX_TURNS: ${env(COACH_MAX_TURNS)}
        COACH_WRAP_COVERAGE: ${env(COACH_WRAP_COVERAGE)}
        COACH_WRAP_STAR: ${env(COACH_WRAP_STAR)}
        COACH_THINKING: ${env(COACH_THINKING)}
        COACH_DAILY_TOKEN_BUDGET: ${env(COACH_DAILY_TOKEN_BUDGET)}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
              - PATCH
              - DELETE
              - OPTIONS
            authType: anonymous
