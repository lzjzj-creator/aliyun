# 知脉主后端 → 阿里云函数计算 FC（custom.debian10 web 函数）
# 部署：cd deploy/fc/zhimai-api && s deploy -y
edition: 3.0.0
name: zhimai-api
access: default
vars:
  region: cn-beijing
  functionName: zhimai-api

resources:
  api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: zhimai FastAPI backend (route/RAG/rewrite)
      runtime: custom.debian10
      timeout: 120
      cpu: 1
      memorySize: 1024
      diskSize: 10240
      instanceConcurrency: 50
      internetAccess: true
      code: ../../../backend
      customRuntimeConfig:
        command:
          - python3
        args:
          - '-u'
          - index.py
        port: 9000
      environmentVariables:
        PATH: >-
          /var/fc/lang/python3.10/bin:/usr/local/bin:/usr/bin:/bin:/code
        PYTHONPATH: /code/vendor
        SUPABASE_URL: ${env(SUPABASE_URL)}
        SUPABASE_SERVICE_KEY: ${env(SUPABASE_SERVICE_KEY)}
        DASHSCOPE_API_KEY: ${env(DASHSCOPE_API_KEY)}
        DEEPSEEK_API_KEY: ${env(DEEPSEEK_API_KEY)}
        ALLOWED_ORIGINS: ${env(ALLOWED_ORIGINS)}
        QWEN_MODEL_CHAT: ${env(QWEN_MODEL_CHAT)}
        EMBEDDING_MODEL: ${env(EMBEDDING_MODEL)}
        MIN_RETRIEVE_SCORE: ${env(MIN_RETRIEVE_SCORE)}
        KB_SOURCE_BASE: ${env(KB_SOURCE_BASE)}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
            authType: anonymous
