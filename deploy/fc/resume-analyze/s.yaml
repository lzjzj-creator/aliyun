# 简历诊断服务（复用公开源码）→ 阿里云函数计算 FC
# 部署：cd deploy/fc/resume-analyze && s deploy -y
edition: 3.0.0
name: resume-analyze
access: default
vars:
  region: cn-beijing
  functionName: resume-analyze

resources:
  api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: resume evidence audit API (vendored upstream)
      runtime: custom.debian10
      timeout: 90
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      instanceConcurrency: 100
      internetAccess: true
      code: ../../../vendor-resume-audit/api
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs20/versions/1
      customRuntimeConfig:
        command:
          - node
          - server.js
        port: 9000
      environmentVariables:
        PATH: >-
          /opt/nodejs20/bin:/usr/local/bin:/usr/bin:/bin
        PORT: '9000'
        DEEPSEEK_API_KEY: ${env(DEEPSEEK_API_KEY)}
        ALLOWED_ORIGINS: ${env(ALLOWED_ORIGINS)}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            methods:
              - GET
              - POST
            authType: anonymous
